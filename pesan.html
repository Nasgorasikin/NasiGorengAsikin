<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pesanan</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  padding:50px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

/* CONTENT */
.modal-content{
  background:#1b1b1b;
  color:white;
  padding:30px;
  border-radius:15px;
  width:320px;
  text-align:center;
  position:relative;
}

/* CLOSE */
.close{
  position:absolute;
  right:15px;
  top:10px;
  font-size:28px;
  cursor:pointer;
}

/* INPUT */
input{
  width:90%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

/* QTY */
.qty-control{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin:20px 0;
}

.qty-control button{
  width:35px;
  height:35px;
  border:none;
  border-radius:50%;
  background:#ff9800;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* TEXT TOTAL */
.total{
  margin-top:10px;
  font-size:18px;
  color:#ff9800;
  font-weight:bold;
}

/* BUTTON */
.checkout-btn{
  background:#ff9800;
  border:none;
  padding:10px 20px;
  color:white;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}
</style>

</head>

<body>

<h1>Halaman Pesanan</h1>

<button onclick="openModal('Nasi Goreng Mawut', 25000)">
  Buka Pesanan Mawut
</button>

<button onclick="openModal('Nasi Goreng Biasa', 18000)">
  Buka Pesanan Biasa
</button>

<!-- MODAL -->
<div id="orderModal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">
      &times;
    </span>

    <h2>Pesanan</h2>

    <input id="namaPemesan" type="text" placeholder="Nama kamu">

    <p id="menuName"></p>

    <div class="qty-control">
      <button onclick="changeQty(-1)">-</button>
      <span id="qty">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>

    <p class="total" id="totalHarga">Total: Rp 0</p>

    <button class="checkout-btn" onclick="checkout()">
      Checkout
    </button>

  </div>

</div>

<script>

let selectedMenu = "";
let qty = 1;
let price = 0;

/* OPEN MODAL */
function openModal(menu, harga){

  selectedMenu = menu;
  price = harga;
  qty = 1;

  document.getElementById("menuName").innerText =
    "Menu : " + selectedMenu;

  document.getElementById("qty").innerText = qty;

  updateTotal();

  document.getElementById("orderModal").style.display = "flex";
}

/* UPDATE TOTAL */
function updateTotal(){
  const total = qty * price;
  document.getElementById("totalHarga").innerText =
    "Total: Rp " + total.toLocaleString("id-ID");
}

/* QTY */
function changeQty(value){
  qty = Math.max(1, qty + value);
  document.getElementById("qty").innerText = qty;
  updateTotal();
}

/* CLOSE */
function closeModal(){
  document.getElementById("orderModal").style.display = "none";
}

/* CHECKOUT */
function checkout(){

  const nama = document.getElementById("namaPemesan").value;

  if(!nama){
    alert("Masukkan nama dulu!");
    return;
  }

  const total = qty * price;

  const phone = "6281234567890";

  const message =
`Halo saya mau pesan:

👤 Nama : ${nama}
🍽️ Menu : ${selectedMenu}
🔢 Jumlah : ${qty}
💰 Total : Rp ${total.toLocaleString("id-ID")}`;

  const url =
`https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

  window.open(url, "_blank");
}

/* CLOSE CLICK OUTSIDE */
window.onclick = function(event){
  const modal = document.getElementById("orderModal");
  if(event.target == modal){
    modal.style.display = "none";
  }
}

</script>

</body>
</html>
